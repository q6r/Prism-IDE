[package]
name = "prism-protocol"
description = "Prism host wire protocol: JSON-RPC envelopes, handshake, error codes and shared entities (TypeScript bindings via ts-rs)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
