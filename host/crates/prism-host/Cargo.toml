[package]
name = "prism-host"
description = "The Prism host: a long-lived local (or VPS) daemon serving the Prism UI over WebSocket JSON-RPC."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "prism-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
memchr = "2.8.3"
portable-pty = "0.9.0"
prism-agents = { version = "0.3.2", path = "../prism-agents" }
prism-proc = { version = "0.3.2", path = "../prism-proc" }
prism-protocol = { version = "0.3.2", path = "../prism-protocol" }
prism-store = { version = "0.3.2", path = "../prism-store" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.9"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
