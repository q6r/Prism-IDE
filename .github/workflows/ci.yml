name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install dependencies
        run: npm ci
      - name: Generate mobile page
        run: npm run remote:build
      - name: Typecheck
        run: npm run typecheck
      - name: Build host
        run: cargo build --release --locked -p prism-host
        working-directory: host
      - name: Node tests with isolated provider fixtures
        run: node --test --test-concurrency=4 tests/*.test.cjs
      - name: Rust tests
        run: cargo test --release --workspace --locked
        working-directory: host
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
        working-directory: host
      - name: Build Electron app
        run: npx electron-vite build
