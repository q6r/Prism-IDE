name: Sugerir uma melhoria
description: Explique um problema de uso e a melhoria proposta.
title: "[Melhoria]: "
body:
  - type: markdown
    attributes:
      value: |
        Procure uma sugestão semelhante antes de abrir outra.
        Esta issue é pública. Use exemplos fictícios e não anexe tokens, logins, conversas privadas, URLs ou QR codes de controle remoto.
  - type: textarea
    id: problem
    attributes:
      label: Qual problema você quer resolver?
      description: Descreva o que está tentando fazer e onde encontra dificuldade.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportamento proposto
      description: Explique como a melhoria funcionaria para quem usa o Prism.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Opcional. Existe alguma forma de contornar o problema hoje?
  - type: textarea
    id: context
    attributes:
      label: Contexto ou exemplo
      description: Opcional. Informe a área afetada e use dados fictícios em exemplos e imagens.
  - type: checkboxes
    id: privacy
    attributes:
      label: Revisão dos anexos
      options:
        - label: Revisei o texto e os anexos e removi segredos e dados pessoais ou privados.
          required: true
